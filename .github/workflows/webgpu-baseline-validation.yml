name: WebGPU baseline validation

on:
  push:
    branches:
      - feat/webgpu-renderer

jobs:
  feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run setup

      - name: Client typecheck
        id: typecheck
        continue-on-error: true
        run: npm exec --yes --package @yarnpkg/cli-dist@4.12.0 -- yarn --cwd client typecheck

      - name: WebGPU foundation tests
        id: webgpu_foundation
        continue-on-error: true
        run: npm exec --yes --package @yarnpkg/cli-dist@4.12.0 -- yarn --cwd client test:webgpu-foundation

      - name: Full client tests
        id: client_tests
        continue-on-error: true
        run: npm exec --yes --package @yarnpkg/cli-dist@4.12.0 -- yarn --cwd client test

      - name: Production client build
        id: client_build
        continue-on-error: true
        run: npm exec --yes --package @yarnpkg/cli-dist@4.12.0 -- yarn --cwd client build

      - name: Feature validation summary
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          WEBGPU_FOUNDATION: ${{ steps.webgpu_foundation.outcome }}
          CLIENT_TESTS: ${{ steps.client_tests.outcome }}
          CLIENT_BUILD: ${{ steps.client_build.outcome }}
        run: |
          printf 'typecheck=%s\n' "$TYPECHECK"
          printf 'webgpu-foundation=%s\n' "$WEBGPU_FOUNDATION"
          printf 'client-tests=%s\n' "$CLIENT_TESTS"
          printf 'client-build=%s\n' "$CLIENT_BUILD"
          test "$TYPECHECK" = success
          test "$WEBGPU_FOUNDATION" = success
          test "$CLIENT_TESTS" = success
          test "$CLIENT_BUILD" = success

  main-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run setup

      - name: Client typecheck
        id: typecheck
        continue-on-error: true
        run: npm exec --yes --package @yarnpkg/cli-dist@4.12.0 -- yarn --cwd client typecheck

      - name: Full client tests
        id: client_tests
        continue-on-error: true
        run: npm exec --yes --package @yarnpkg/cli-dist@4.12.0 -- yarn --cwd client test

      - name: Production client build
        id: client_build
        continue-on-error: true
        run: npm exec --yes --package @yarnpkg/cli-dist@4.12.0 -- yarn --cwd client build

      - name: Main baseline summary
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          CLIENT_TESTS: ${{ steps.client_tests.outcome }}
          CLIENT_BUILD: ${{ steps.client_build.outcome }}
        run: |
          printf 'main-typecheck=%s\n' "$TYPECHECK"
          printf 'main-client-tests=%s\n' "$CLIENT_TESTS"
          printf 'main-client-build=%s\n' "$CLIENT_BUILD"
